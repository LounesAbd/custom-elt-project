version: 2

models:
  - name: film_ratings
    description: "A model that combines film details, ratings, and actors."
    columns:
      - name: film_id
        description: "Unique identifier for each film."
      - name: title
        description: "Title of the film."
      - name: release_date
        description: "Release date of the film."
      - name: price
        description: "Price of the film."
      - name: rating
        description: "Public rating of the film."
      - name: user_rating
        description: "Average user rating of the film."
      - name: rating_category
        description: "Category of the film based on user ratings (Excellent, Good, Average, Poor)."
      - name: actors
        description: "Comma-separated list of actors in the film."